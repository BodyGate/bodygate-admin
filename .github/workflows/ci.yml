name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Typecheck, lint, governance tests, build
    runs-on: ubuntu-latest
    # PostgreSQL di servizio per i test che usano il database (limite login atomico,
    # creazione palestra): senza, quei test verrebbero saltati.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (full report, informational)
        run: npm run lint || true

      - name: Lint baseline gate (BG-P1-002)
        run: npm run lint:baseline

      - name: Route / navigation / deprecation governance
        run: |
          npm run qa:routes
          npm run qa:navigation
          npm run qa:deprecations

      - name: Platinum runtime parity tests
        run: |
          npm run qa:platinum-runtime
          npm run qa:platinum-customers
          npm run qa:platinum-completion

      - name: Prepare PostgreSQL for database tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "create database login_test" -c "create database tenant_test"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -d login_test -f tests/support/supabase-stubs.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -d tenant_test -f tests/support/supabase-stubs.sql

      - name: Business logic and database tests
        env:
          LOGIN_THROTTLE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/login_test
          TENANT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tenant_test
        run: npm test

      - name: Secret scan (tracked files)
        run: |
          if git grep -nIE "(SUPABASE_SERVICE_ROLE_KEY|BODYGATE_SESSION_SECRET|BODYGATE_MACHINE_KEY|DNAKE_PASSWORD_MD5|GATEBOX_SECRET)\s*=\s*['\"][^'\"]+['\"]" -- . ':!*.example' ':!docs/**' ':!.github/workflows/ci.yml'; then
            echo "::error::Possible committed secret matched above — remove it and rotate the credential."
            exit 1
          fi

      - name: Build (CI placeholder environment)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          BODYGATE_SESSION_SECRET: ci-placeholder-session-secret
        run: npm run build
